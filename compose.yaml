name: kol-intelligence

x-app: &app
  image: kol-intelligence:dev
  init: true
  environment: &env
    DATABASE_URL: postgresql://${POSTGRES_USER:-kol}:${POSTGRES_PASSWORD:-kol_local_dev}@postgres:5432/${POSTGRES_DB:-kol_intelligence}
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    AI_SERVICE_URL: http://ai:8001
    MODEL_VERSION: rules-v1
  restart: unless-stopped

x-airflow: &airflow
  image: kol-airflow:dev
  init: true
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/passwords.json
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow_local_dev}@airflow-postgres:5432/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-kol-airflow-local-development-secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: kol-airflow-local
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__API__WORKERS: "1"
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow_local_dev}
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    PROJECT_API_URL: http://api:8000
    PYTHONPATH: /opt/project/src
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./src:/opt/project/src:ro
    - ./data/samples:/opt/project/data/samples:ro
    - airflow-logs:/opt/airflow/logs
    - airflow-auth:/opt/airflow/auth
  restart: unless-stopped

services:
  airflow-postgres:
    image: postgres:16.6-bookworm
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow_local_dev}
    volumes: ["airflow-postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-init:
    <<: *airflow
    restart: "no"
    command: ["bash", "-c", "airflow db migrate && python /opt/project/airflow/init_auth.py"]
    volumes:
      - ./airflow/init_auth.py:/opt/project/airflow/init_auth.py:ro
      - airflow-auth:/opt/airflow/auth
      - airflow-logs:/opt/airflow/logs
    depends_on:
      airflow-postgres: {condition: service_healthy}

  airflow-api-server:
    <<: *airflow
    build:
      context: .
      dockerfile: airflow/Dockerfile
    command: ["api-server"]
    ports: ["127.0.0.1:${AIRFLOW_PORT:-8080}:8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health')"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    depends_on:
      airflow-init: {condition: service_completed_successfully}

  airflow-scheduler:
    <<: *airflow
    hostname: airflow-scheduler
    command: ["scheduler"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8974/health')"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    depends_on:
      airflow-api-server: {condition: service_healthy}
      setup: {condition: service_completed_successfully}

  airflow-dag-processor:
    <<: *airflow
    command: ["dag-processor"]
    depends_on:
      airflow-init: {condition: service_completed_successfully}

  postgres:
    image: postgres:16.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kol_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-kol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kol_local_dev}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data/logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 20

  setup:
    <<: *app
    restart: "no"
    command: ["python", "-m", "kol.setup"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}

  ai:
    <<: *app
    command: ["uvicorn", "kol.ai:app", "--host", "0.0.0.0", "--port", "8001"]
    ports: ["127.0.0.1:${AI_PORT:-8001}:8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    <<: *app
    command: ["python", "-m", "kol.worker"]
    depends_on:
      setup: {condition: service_completed_successfully}
      ai: {condition: service_healthy}

  spark:
    <<: *app
    command:
      - spark-submit
      - --master
      - local[2]
      - --driver-memory
      - 1g
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.7
      - --conf
      - spark.jars.ivy=/tmp/ivy
      - /app/src/kol/streaming.py
    volumes:
      - pipeline-data:/data
      - spark-ivy:/tmp/ivy
    depends_on:
      setup: {condition: service_completed_successfully}

  api:
    <<: *app
    build: .
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    depends_on:
      setup: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  replay:
    <<: *app
    profiles: [tools]
    restart: "no"
    command: ["python", "-m", "kol.replay", "--file", "data/samples/demo.jsonl", "--run-id", "demo"]
    depends_on:
      setup: {condition: service_completed_successfully}

volumes:
  postgres-data:
  kafka-data:
  pipeline-data:
  spark-ivy:
  airflow-postgres-data:
  airflow-logs:
  airflow-auth:

